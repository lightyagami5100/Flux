assumptions:
  - "DETECTION_TARGET: 'potholes'"
  - "MAP_MARKER_MEANING: 'one marker per canonical pothole entity (deduplicated across multi-pass recordings)'"
  - "DEDUP_RADIUS: '10.0 meters Great-Circle Haversine'"
  - "SCALE: 'continuous background chunked uploads from React Native (Expo), 5 MB chunks'"
  - "UPLOAD_FLOW: 'session → chunks → complete → ingest → worker infer → real-time spatial dedup clustering'"
  - "VISUALIZATION: 'Leaflet + clustering + in-popup snapshots + SSE radar + bbox queries + repair lifecycle'"
  - "OBSERVABILITY: 'Prometheus metrics (/metrics), health probes (/healthz, /livez, /readyz)'"
  - "AUTO_CREATE_TABLES: 'stays true in production - no migration tool exists in the repo yet'"
  - "PROD_GUARD: 'ENVIRONMENT != development/dev/test/local makes dev-default credentials a hard startup failure'"
  - "POSTGIS: 'postgis/postgis image is unnecessary - clustering is Haversine in Python, no PostGIS types used'"
  - "VIDEO_SAMPLING: 'fixed stride (every 15th frame, max 20) - no motion/bump gating, so smooth road still costs 20 API calls'"
  - "ROBOFLOW_MODEL: 'two public Universe models live-verified with the workspace key (1 probe call each): pothole-detection-03iso/1 (Potholes, mAP@50 0.556) + damage-road/1 (pothole+crack, mAP@50 0.719), set via ROBOFLOW_MODEL_IDS in local .env'"
  - "MULTI_MODEL_COST: 'calls per clip = sampled frames x len(models); default 20 x 2 = 40'"
  - "UPLOAD_AUTH: 'require_upload_auth setting: defaults to False for mobile app hackathon mode, True enforced in production'"
  - "CORS_ORIGINS: 'cors_origins setting: wildcard allowed in development, production requires explicit origin list'"
  - "APP_BUILD: 'Expo EAS Build for native apps - preview profile produces APK (Android), production produces AAB+IPA; bundle IDs com.flux.patrol'"
  - "BODY_SIZE_EXEMPT: '/v1/ingest/upload and /api/uploads bypass MAX_BODY_BYTES (256 KiB); the cap still applies to JSON ingest routes'"
  - "SQLITE_FOR_UPDATE: 'SQLAlchemy 2.0.52 compiles FOR UPDATE to a no-op on SQLite, so the guard in cluster_detection is defensive, not a crash fix (verified)'"
  - "REALTIME_SSE: 'Worker publishes to Redis pub/sub channel flux:events:live after inference; SSE endpoint subscribes (instant) with DB poll fallback'"
  - "DASHBOARD_WOW: 'sonar pulse on new detections, severity-colored toasts, animated KPI counters, live event count badge'"
  - "SESSION_SYNC: 'UploadManager session hydration via Redis ensures seamless multi-pod horizontal scaling'"
  - "RATE_LIMITING: 'Sliding-window Redis rate limiter on upload endpoints prevents DoW external API billing exhaustion'"
  - "OBSERVATION_CAP: 'Inline canonical observations list capped to 50 items to eliminate PostgreSQL TOAST row bloat'"
next_action: "Push hardened MS-017 changes to origin/main."
